<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Dungeon Manager - Accueil</title>
    <link href="{{ url_for('static',filename='styles/style.css') }}" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body class="welcome-body">

    <div class="parchment-container">
        <h1>📜 Contrat de Gestion</h1>
        
        <p class="intro-text">
            Oyez, oyez ! La guilde des architectes cherche un nouveau Maître du Donjon.<br>
            Veuillez définir les dimensions de votre futur domaine.
        </p>

        <form action="/create_game" method="POST" class="config-form">
            
            <div class="form-group">
                <label for="width">Largeur (X)</label>
                <input type="number" id="width" name="width" value="10" min="5" max="25">
            </div>

            <div class="form-group">
                <label for="height">Hauteur (Y)</label>
                <input type="number" id="height" name="height" value="10" min="5" max="20">
            </div>

            <div class="presets">
                <p>Ou choisissez un modèle :</p>
                <button type="button" onclick="setPreset(10, 10)">Petite Auberge</button>
                <button type="button" onclick="setPreset(15, 12)">Donjon Standard</button>
                <button type="button" onclick="setPreset(20, 15)">Forteresse</button>
            </div>

            <p class = "fine-print"><a href="/rules">Les petites lignes du contrat (règles)</a></p>

            <button type="submit" class="sign-button">✒️ Signer le contrat</button>
        </form>
    </div>

    <script>
        function setPreset(w, h) {
            document.getElementById('width').value = w;
            document.getElementById('height').value = h;
        }
    </script>
</body>
</html>
